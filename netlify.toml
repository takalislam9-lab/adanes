# ============================================================
#  Configuración de Netlify para Adanes
#  Sitio 100% estático: no requiere proceso de build.
# ============================================================

[build]
  publish = "."
  command = ""

# Cabeceras de seguridad y caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El contenido editable no debe cachearse de forma agresiva
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
